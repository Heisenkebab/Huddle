name: Migrations

# Applies Supabase migrations to the production project.
# Runs when migration files change on main, or manually from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

permissions:
  contents: read

# Never run two migration pushes against prod at the same time, and never cancel one halfway
concurrency:
  group: migrations-production
  cancel-in-progress: false

jobs:
  migrate:
    name: Push migrations to production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Optional: add required reviewers to this environment in GitHub to approve each run
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      # Uses the Supabase CLI from devDependencies, same version as CI and local dev
      - run: npm ci

      - name: Link production project
        run: npx supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}

      # Logs which migrations will be applied before touching the database
      - name: Dry run
        run: npx supabase db push --dry-run

      - name: Push migrations
        run: npx supabase db push
