name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Least privilege: jobs only need to read the code
permissions:
  contents: read

# Cancel older runs on the same branch/PR when new commits are pushed
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, typecheck and Vitest. Fast feedback, no browser needed.
  unit:
    name: Lint, types & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      # Same as running `npm run check` locally
      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Vitest
        run: npx vitest run

  # Server actions against a throwaway local Supabase, with all migrations applied
  integration:
    name: DB integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      # Uses the Supabase CLI from devDependencies; only starts the services the tests need
      - name: Start local Supabase
        run: npx supabase start -x studio,imgproxy,storage-api,mailpit,realtime,edge-runtime,logflare,vector,supavisor

      - name: Integration tests
        run: npm run test:integration

  # Build the app and run Playwright against the production build
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      # Speeds up repeat `next build` runs
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.{js,jsx,ts,tsx}') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # The app needs a Supabase backend; use a throwaway local stack like the integration job
      - name: Start local Supabase
        run: npx supabase start -x studio,imgproxy,storage-api,mailpit,realtime,edge-runtime,logflare,vector,supavisor

      # NEXT_PUBLIC_* vars are inlined by `next build`, so export them before building
      - name: Export Supabase env
        run: |
          npx supabase status -o env | sed -n \
            -e 's/^API_URL="\(.*\)"$/NEXT_PUBLIC_SUPABASE_URL=\1/p' \
            -e 's/^PUBLISHABLE_KEY="\(.*\)"$/NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=\1/p' \
            -e 's/^ANON_KEY="\(.*\)"$/NEXT_PUBLIC_SUPABASE_ANON_KEY=\1/p' \
            >> "$GITHUB_ENV"

      - name: Build
        run: npm run build

      # Playwright starts `npm run start` itself via `webServer` in playwright.config.ts
      - name: Run Playwright
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
