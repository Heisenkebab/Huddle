version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # Updates go through dev like all other changes, not straight to main
    target-branch: dev
    schedule: { interval: weekly }
    # Bundle minor/patch bumps into one PR; majors stay separate for manual review
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule: { interval: weekly }
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)
